# WORLD GEOMETRY DRAFT
# This is valid YAML and can be launched as-is. Read and change the notes while
# turning it into the student's final room.

# A level contains a list of zones. A zone is a named navigable area such as a
# room, corridor, or lobby. This example deliberately uses one big room.
zones:
  - name: big_room
    description: Large room for learning walls, objects, and scenario testing

    # Floor material identifier. It participates in the Arena world model, but
    # Gazebo currently supplies its physical floor from the base ground plane.
    material:
      - Common/Material/Porcelain_Tile_4
      - {}

    # CORNERS: ordered floor polygon in metres.
    # These four points make a 20 m x 15 m rectangle. List points around the
    # edge without crossing lines and do not repeat the first point at the end.
    corners:
      - {x: 0.0,  y: 0.0,  z: 0.0}  # south-west
      - {x: 17.0, y: 0.0,  z: 0.0}  # south-east
      - {x: 17.0, y: 33.0, z: 0.0}  # north-east
      - {x: 0.0,  y: 33.0, z: 0.0}  # north-west

    # WALLS: physical boundary segments. Corners do not create walls by
    # themselves, so the endpoints below explicitly connect the four corners.
    # `kind` resolves a local preset under assets/Common/Wall/<kind>/<kind>.yaml.
    walls:
      # South: a 40 cm structural wall.
      - start: {x: 0.0, y: 0.0, z: 0.0}
        end: {x: 17.0, y: 0.0, z: 0.0}
        kind: standard_wall

      # East: a normal 15 cm wall.
      - start: {x: 17.0, y: 0.0, z: 0.0}
        end: {x: 17.0, y: 33.0, z: 0.0}
        kind: standard_wall

      # North: a thin 5 cm divider, included to make comparison easy in Gazebo.
      - start: {x: 17.0, y: 33.0, z: 0.0}
        end: {x: 0.0, y: 33.0, z: 0.0}
        kind: standard_wall

      # West: another normal wall.
      - start: {x: 0.0, y: 33.0, z: 0.0}
        end: {x: 0.0, y: 0.0, z: 0.0}
        kind: standard_wall

    # DOORS: managed openings. Empty for this exercise. To add one later, split
    # its wall into two segments so no wall remains behind the door, then put a
    # door entry in this list.
    doors: []

    # ELEVATORS: level-changing mechanisms. Not needed in a one-level room.
    elevators: []

    # ENTITIES: objects permanently belonging to this room.
    entities:
      static:
        # `name` must be unique. `model` resolves the included local box asset.
        # Compact pose form is [x, y, yaw], with yaw measured in radians.
        - name: box_1
          model: tutorial_box2x2
          pose: [3.0, 3.0, 0.0] # (20, 20) to (40, 40)
          bbox: [[-1.0, 1.0], [-1.0, 1.0], [0.0, 1.0]]

        - name: box_2
          model: tutorial_box2x4
          pose: [3.0, 6.5, 0.0] # (40, 20) to (80, 40) (flip x and y)
          bbox: [[-1.0, 1.0], [-2.0, 2.0], [0.0, 1.0]]

        - name: box_3
          model: tutorial_box
          pose: [4.5, 9.5, 0.0] # (86, 38) to (96, 48) (flip x and y)
          bbox: [[-0.25, 0.25], [-0.25, 0.25], [0.0, 1.0]]

        - name: box_4
          model: tutorial_box15x1
          pose: [4.25, 15.5, 0.0] # (150, 35) to (160, 50) (flip x and y)
          bbox: [[-0.75, 0.75], [-0.5, 0.5], [0.0, 1.0]]

        - name: box_5
          model: tutorial_box
          pose: [4.5, 23.1, 0.0] # (226, 40) to (236, 50) (flip x and y)
          bbox: [[-0.25, 0.25], [-0.25, 0.25], [0.0, 1.0]]

        - name: box_6
          model: tutorial_box
          pose: [6.0, 5.7, 0.0] # (52, 60) to (62, 70) (flip x and y)
          bbox: [[-0.25, 0.25], [-0.25, 0.25], [0.0, 1.0]]

        - name: box_7
          model: tutorial_box
          pose: [6.5, 20.5, 0.0] # (200, 60) to (210, 70) (flip x and y)
          bbox: [[-0.25, 0.25], [-0.25, 0.25], [0.0, 1.0]]

        - name: box_8
          model: tutorial_box
          pose: [6.5, 24.5, 0.0] # (240, 60) to (250, 70) (flip x and y)
          bbox: [[-0.25, 0.25], [-0.25, 0.25], [0.0, 1.0]]

        - name: box_9
          model: tutorial_box
          pose: [6.5, 28.5, 0.0] # (280, 60) to (290, 70) (flip x and y)
          bbox: [[-0.25, 0.25], [-0.25, 0.25], [0.0, 1.0]]

        - name: box_10
