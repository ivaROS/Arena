          bbox: [[-0.25, 0.25], [-0.25, 0.25], [0.0, 1.0]]

        - name: box_23
          model: tutorial_box15x1
          pose: [12.5, 15.0, -3.0] # trial and error needed
          bbox: [[-0.75, 0.75], [-0.5, 0.5], [0.0, 1.0]]

        - name: box_24
          model: tutorial_box
          pose: [13.0, 18.5, 0.0] # (180, 125) to (190, 135) (flip x and y)
